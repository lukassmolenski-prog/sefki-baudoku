<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>SEF-KI Baudoku</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#050b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SEF-KI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: ein Handy-Cockpit. Oben Marke + GPS-Status, Mitte die Ansicht, unten der Lotse-Balken und die Navigation.
   Holografisches HUD wie im Smolens·KI-Kontext: Navy-Leere, Cyan-Linien, Amber nur für "jetzt tun". */
:root{
  --void:#050b16;          /* Hintergrund */
  --deep:#0a1830;          /* Paneel-Grund */
  --glass:rgba(18,52,92,.42);
  --line:rgba(82,206,236,.26);
  --line-hi:rgba(82,206,236,.62);
  --cyan:#3fd8ef;          /* Akzent */
  --cyan-dim:#5fa9c0;
  --ink:#e2f6ff;           /* Text */
  --mute:#89a9bd;
  --amber:#ffa040;         /* nächste Aktion */
  --ok:#48e59a;
  --bad:#ff5a6e;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:4px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--void)}
body.noscroll{overflow:hidden}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(60% 40% at 50% 18%,rgba(40,120,190,.20),transparent 70%),
   radial-gradient(50% 50% at 80% 90%,rgba(30,90,150,.16),transparent 70%),
   linear-gradient(rgba(82,206,236,.035) 1px,transparent 1px) 0 0/28px 28px,
   linear-gradient(90deg,rgba(82,206,236,.035) 1px,transparent 1px) 0 0/28px 28px,
   var(--void);}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan-dim)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(150px + env(safe-area-inset-bottom,0px));}

/* ---------- Kopf ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;
  padding-block:10px;margin:0 -4px;background:linear-gradient(var(--void) 70%,transparent)}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.brand svg{width:34px;height:34px;flex:none}
.word{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em;line-height:1;font-stretch:100%;white-space:nowrap}
.word b{color:var(--cyan);font-weight:800}
.module{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;color:var(--mute);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.module em{font-style:normal;color:var(--ink)}
.pill{display:flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(8,24,48,.7);
  font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.dot.good{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.dot.ok{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.dot.weak{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.dot.bad{background:var(--bad)}
.dot.search{background:var(--cyan);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:rgba(8,24,48,.7);flex:none}
.iconbtn svg{width:18px;height:18px}

/* ---------- Paneele ---------- */
.panel{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,rgba(24,66,112,.34),rgba(8,22,44,.55));
  border-radius:var(--r);padding:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--cyan);opacity:.85;pointer-events:none}
.panel::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.panel::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.stack{display:flex;flex-direction:column;gap:14px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.ph h2{font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin:0;color:var(--cyan)}

/* ---------- Lotse ---------- */
.lotse{padding-top:16px}
.lhead{display:flex;gap:14px;align-items:flex-start}
#avatar{width:76px;height:76px;flex:none}
.say{font-family:var(--f-display);font-size:19px;line-height:1.3;font-weight:600;margin:6px 0 0;text-wrap:pretty;min-height:2.6em}
.say .hl{color:var(--cyan)}
.cards{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sug-lbl{text-align:center;margin-top:16px}
.card{display:grid;grid-template-columns:30px 1fr;gap:4px 12px;text-align:left;padding:11px 12px;border:1px solid var(--line-hi);
  background:linear-gradient(180deg,rgba(30,86,140,.45),rgba(12,36,70,.6));border-radius:var(--r);position:relative;transition:transform .12s,border-color .12s}
.card:hover{border-color:var(--cyan)}
.card:active{transform:scale(.985)}
.card .n{grid-row:span 2;width:26px;height:26px;border:1.5px solid currentColor;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--ink);margin-top:1px}
.card .t{font-weight:700;font-size:15.5px;padding-right:84px;line-height:1.25}
.card .x{font-size:13px;color:var(--mute);line-height:1.35}
.card .tag{position:absolute;top:9px;right:10px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;color:var(--cyan)}
.card.hot{border-color:var(--amber);box-shadow:0 0 0 1px rgba(255,160,64,.25),0 0 28px rgba(255,160,64,.14)}
.card.hot .tag,.card.hot .n{color:var(--amber)}

/* ---------- Baustellen-Status ---------- */
.site-hero{display:grid;grid-template-columns:118px 1fr;gap:14px;align-items:center}
.ring{width:118px;height:118px}
.site-name{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.15;font-stretch:92%;text-wrap:balance;margin:2px 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--f-mono);font-size:11.5px;color:var(--mute)}
.meta b{color:var(--ink);font-weight:600}
.badge{display:inline-block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;padding:2px 6px;border:1px solid currentColor;border-radius:2px;text-transform:uppercase}
.badge.in{color:var(--ok)}.badge.maybe{color:var(--amber)}.badge.out{color:var(--mute)}.badge.ex{color:var(--cyan-dim)}
.check{display:flex;flex-direction:column;margin-top:14px}
.phase-h{display:flex;align-items:center;gap:8px;margin:10px 0 4px}
.phase-h::after{content:"";flex:1;height:1px;background:var(--line)}
.crow{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid rgba(82,206,236,.08);text-align:left;width:100%}
.crow:last-child{border-bottom:0}
.crow .st{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--mute);display:grid;place-items:center}
.crow.done .st{border-color:var(--ok);background:rgba(72,229,154,.15)}
.crow.done .st::after{content:"";width:8px;height:4px;border:2px solid var(--ok);border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
.crow.next .st{border-color:var(--amber);box-shadow:0 0 10px rgba(255,160,64,.6)}
.crow.next .st::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber)}
.crow .cl{font-size:14px;line-height:1.3}
.crow.next .cl{color:var(--amber);font-weight:700}
.crow .opt{font-family:var(--f-mono);font-size:10px;color:var(--mute);margin-left:6px}
.crow img{width:40px;height:30px;object-fit:cover;border:1px solid var(--line);border-radius:2px}
.crow .go{font-family:var(--f-mono);font-size:10.5px;color:var(--amber);letter-spacing:.1em}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:10px;background:rgba(8,24,48,.55)}
.stat .v{font-family:var(--f-mono);font-size:24px;font-weight:600;line-height:1.1;margin-top:4px}
.stat .v.warn{color:var(--amber)}.stat .v.good{color:var(--ok)}
.stat .s{font-size:11.5px;color:var(--mute)}

.slist{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 2px;border-bottom:1px solid rgba(82,206,236,.1);text-align:left;width:100%}
.srow:last-child{border-bottom:0}
.srow .sn{font-weight:700;font-size:15px;min-width:0}
.srow .sd{font-family:var(--f-mono);font-size:12px;color:var(--mute);text-align:right}
.srow .bar{grid-column:1/-1;height:3px;background:rgba(82,206,236,.12);border-radius:2px;overflow:hidden;margin-top:6px}
.srow .bar i{display:block;height:100%;background:var(--cyan)}
.srow .bar i.full{background:var(--ok)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border:1px solid var(--line-hi);border-radius:var(--r);
  font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;background:rgba(20,60,104,.5);color:var(--ink)}
.btn:hover{border-color:var(--cyan)}
.btn.pri{background:linear-gradient(180deg,#36c7e2,#1f9fbd);border-color:#6fe6fa;color:#03121f;box-shadow:0 0 24px rgba(63,216,239,.3)}
.btn.amb{border-color:var(--amber);color:var(--amber);background:rgba(255,160,64,.08)}
.btn.danger{border-color:var(--bad);color:var(--bad);background:rgba(255,90,110,.08)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 11px;border:1px solid var(--line);border-radius:999px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;white-space:nowrap;background:rgba(8,24,48,.6)}
.chip.on{border-color:var(--cyan);color:var(--void);background:var(--cyan);font-weight:600}
.demo{border-style:dashed}

/* ---------- Unterer Bereich ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-bottom:env(safe-area-inset-bottom,0px);
  background:linear-gradient(transparent,rgba(5,11,22,.92) 26%,var(--void));}
.dock-in{max-width:560px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-top:18px}
.next{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;margin-bottom:8px;
  border:1px solid var(--amber);border-radius:var(--r);background:rgba(40,26,10,.75);box-shadow:0 0 22px rgba(255,160,64,.15)}
.next .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;color:var(--amber)}
.next .t{font-weight:700;font-size:14px;line-height:1.25;min-width:0}
.next svg{width:18px;height:18px;color:var(--amber)}
.nav{display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end;height:64px;border-top:1px solid var(--line);background:rgba(6,16,32,.96);border-radius:12px 12px 0 0;padding:0 6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.tab svg{width:20px;height:20px}
.tab.on{color:var(--cyan)}
.tab.on::after{content:"";width:22px;height:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan);margin-top:-1px}
.fab{justify-self:center;align-self:center;width:66px;height:66px;margin-top:-30px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,#5fe6fb,#1a90b0 70%);border:3px solid var(--void);box-shadow:0 0 0 1px var(--cyan),0 0 30px rgba(63,216,239,.45);color:#03121f}
.fab svg{width:28px;height:28px}

/* ---------- Karte ---------- */
.mapwrap{position:relative;height:min(62vh,560px);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#040a14;touch-action:none}
#map{width:100%;height:100%;display:block}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:38px;height:38px;border:1px solid var(--line-hi);background:rgba(6,16,32,.85);border-radius:var(--r);font-family:var(--f-mono);font-size:18px;display:grid;place-items:center}
.mapctl button.on{border-color:var(--cyan);color:var(--cyan)}
.maplegend{position:absolute;left:10px;top:10px;display:flex;gap:10px;font-family:var(--f-mono);font-size:10px;color:var(--mute);background:rgba(6,16,32,.8);padding:5px 8px;border:1px solid var(--line);border-radius:3px}
.maplegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}

/* ---------- Galerie ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{padding:9px 6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.seg button.on{background:var(--cyan);color:var(--void);font-weight:600}
.day{margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
.th{position:relative;aspect-ratio:4/3;max-width:100%;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--deep)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .pb{position:absolute;left:4px;top:4px;font-family:var(--f-mono);font-size:10px;font-weight:600;width:18px;height:18px;display:grid;place-items:center;border-radius:2px;color:#03121f}
.th .sy{position:absolute;right:4px;top:4px;width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;background:var(--amber)}
.th .sy.ok{background:var(--ok)}
.th .tl{position:absolute;left:0;right:0;bottom:0;padding:12px 5px 3px;font-size:10.5px;line-height:1.2;background:linear-gradient(transparent,rgba(3,10,20,.88));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:28px 10px;text-align:center;color:var(--mute)}

/* ---------- Sheets ---------- */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(2,6,14,.66);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:linear-gradient(180deg,#0d2240,#071428);border:1px solid var(--line-hi);border-bottom:0;border-radius:14px 14px 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line-hi);margin:0 auto 12px}
.sheet h3{font-family:var(--f-display);font-size:21px;font-weight:800;margin:0 0 4px;font-stretch:95%;text-wrap:balance}
.sheet .sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld input[type=text],.fld input[type=date],.fld select,.fld textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);background:rgba(4,14,30,.8);font-size:15px}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--cyan);outline:none}
.inrow{display:flex;gap:8px}
.inrow>*:first-child{flex:1;min-width:0}
input[type=range]{width:100%;accent-color:var(--cyan)}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tpl{padding:10px;border:1px solid var(--line);border-radius:var(--r);text-align:left;background:rgba(8,24,48,.6)}
.tpl b{display:block;font-size:13.5px}
.tpl span{font-size:11.5px;color:var(--mute)}
.tpl.on{border-color:var(--cyan);background:rgba(63,216,239,.12)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border:1px solid var(--line);border-radius:var(--r);font-size:10.5px;background:rgba(8,24,48,.6)}
.cat svg{width:22px;height:22px;color:var(--cyan)}
.cat.on{border-color:var(--cyan);background:rgba(63,216,239,.16)}
.phs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.phs button{padding:10px 4px;border:1px solid var(--line);border-radius:var(--r);font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.phs button.on[data-p=V]{border-color:#3fd8ef;color:#03121f;background:#3fd8ef}
.phs button.on[data-p=W]{border-color:#ffa040;color:#1c0f02;background:#ffa040}
.phs button.on[data-p=N]{border-color:#48e59a;color:#03170c;background:#48e59a}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin:12px 0}
.kv dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan-dim);padding-top:2px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.big{width:100%;max-width:100%;border:1px solid var(--line);border-radius:var(--r);display:block}
.qual{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.q{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;padding:4px 8px;border-radius:2px;border:1px solid currentColor}
.q.g{color:var(--ok)}.q.w{color:var(--amber)}.q.b{color:var(--bad)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(82,206,236,.1)}
.tog span small{display:block;color:var(--mute);font-size:12px}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:13px;background:rgba(137,169,189,.3);position:relative;flex:none;cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:left .15s}
.sw:checked{background:var(--cyan)}
.sw:checked::after{left:23px;background:var(--void)}
.note{font-size:13px;color:var(--mute);line-height:1.5}
.note b{color:var(--ink)}
.warnbox{border:1px solid var(--amber);color:var(--amber);background:rgba(255,160,64,.07);padding:10px 12px;border-radius:var(--r);font-size:13px}

/* ---------- Kamera ---------- */
.cam{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,8,20,.55))}
.cam .frame{position:absolute;inset:18% 7% 26%;pointer-events:none}
.cam .frame i{position:absolute;width:26px;height:26px;border:2px solid var(--cyan);filter:drop-shadow(0 0 4px var(--cyan))}
.cam .frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.cam .frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.cam .frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.cam .frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.level{position:absolute;left:50%;top:50%;width:120px;height:2px;margin-left:-60px;background:rgba(255,255,255,.6);transition:background .2s}
.level.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.camtop{position:relative;z-index:2;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:flex-start}
.instr{flex:1;min-width:0;border:1px solid var(--amber);background:rgba(20,12,4,.72);border-radius:var(--r);padding:10px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.instr.free{border-color:var(--line-hi);background:rgba(4,14,30,.72)}
.instr .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;color:var(--amber)}
.instr.free .k{color:var(--cyan)}
.instr .t{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.2;margin:3px 0}
.instr .h{font-size:13px;color:#d6e6ee;line-height:1.35}
.camstat{position:relative;z-index:2;display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap;padding:0 14px}
.camstat .pill{font-size:11px}
.cambot{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:16px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:linear-gradient(transparent,rgba(0,6,16,.8))}
.shutter{width:78px;height:78px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;box-shadow:0 0 0 2px var(--cyan),0 0 30px rgba(63,216,239,.5)}
.shutter i{width:62px;height:62px;border-radius:50%;background:#fff;transition:transform .1s}
.shutter:active i{transform:scale(.88)}
.camside{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;color:#cfe4ee;text-transform:uppercase}
.camside .iconbtn{width:46px;height:46px}
.camside.on .iconbtn{border-color:var(--amber);color:var(--amber)}
.camfb{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:120px 24px 180px;text-align:center;
  background:radial-gradient(60% 40% at 50% 45%,rgba(40,120,190,.25),transparent 70%),#030812}
.camfb p{max-width:34ch;color:var(--mute);font-size:14px;margin:0}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
.flash.go{animation:fl .35s ease-out}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
.review{position:absolute;inset:0;z-index:5;overflow:auto;background:linear-gradient(180deg,#0b1f3a,#050b16);
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.review-in{max-width:560px;margin:0 auto}
.review .actions{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,#050b16 30%);display:flex;justify-content:center}
.review .actions .row{max-width:560px;width:100%}

/* ---------- Markup ---------- */
.mk{position:fixed;inset:0;z-index:90;background:#02060d;display:flex;flex-direction:column}
.mk canvas{flex:1;min-height:0;width:100%;touch-action:none}
.mkbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.mkbar .btn{min-height:40px;padding:8px 12px}
.mkbar .btn.on{border-color:var(--amber);color:var(--amber)}

/* ---------- Meldungen ---------- */
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;max-width:min(92vw,480px);
  padding:10px 14px;border:1px solid var(--line-hi);background:rgba(6,18,36,.96);border-radius:var(--r);font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:up .2s}
.banner{position:fixed;left:0;right:0;top:0;z-index:96;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,#3a1f06,#241303);border-bottom:2px solid var(--amber);color:#ffe2c2;box-shadow:0 10px 40px rgba(255,160,64,.25)}
.banner-in{max-width:560px;margin:0 auto}
.banner b{color:var(--amber);font-family:var(--f-mono);font-size:11px;letter-spacing:.16em}
.banner p{margin:4px 0 10px;font-size:15px;font-weight:600}
.view[hidden]{display:none!important}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (min-width:760px){
  .app{padding-top:10px}

}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
'use strict';
/* =========================================================
   SEF-KI Baudoku – GPS-Fotodokumentation für Baustellen
   Smolens·KI · für Sefkan
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const RAD = Math.PI / 180;
function dist(a, b) {
  const dLat = (b.lat - a.lat) * RAD, dLon = (b.lon - a.lon) * RAD;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * RAD) * Math.cos(b.lat * RAD) * Math.sin(dLon / 2) ** 2;
  return 2 * 6371008.8 * Math.asin(Math.sqrt(s));
}
const DIRS = ['N', 'NO', 'O', 'SO', 'S', 'SW', 'W', 'NW'];
const dirName = h => DIRS[Math.round((((h % 360) + 360) % 360) / 45) % 8];
const fmtDist = m => m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(m < 10000 ? 1 : 0).replace('.', ',') + ' km';
const pad = n => String(n).padStart(2, '0');
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const fmtDay = ts => new Date(ts).toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });
const fmtDate = ts => new Date(ts).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
const fmtTime = ts => new Date(ts).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
const stamp = ts => { const d = new Date(ts); return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()); };
const slug = s => String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss').replace(/[^\w]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'foto';
const coord = (lat, lon) => lat == null ? '–' : lat.toFixed(6) + ', ' + lon.toFixed(6);
const short = s => s.length > 26 ? s.slice(0, 24) + '…' : s;

const PH = { V: { n: 'Vorher', c: '#3fd8ef' }, W: { n: 'Während', c: '#ffa040' }, N: { n: 'Nachher', c: '#48e59a' } };
const ICON = {
  uebersicht: '<rect x="3" y="4" width="18" height="16"/><path d="M3 16l5-5 4 4 3-3 6 5"/>',
  detail: '<circle cx="10" cy="10" r="6"/><path d="M14.5 14.5L21 21"/>',
  graben: '<path d="M2 7h5l2 11h6l2-11h5"/><path d="M12 9v6M10.5 10.5h3"/>',
  leitung: '<path d="M2 10h20M2 14h20M6 8v8M18 8v8"/>',
  oberflaeche: '<path d="M2 17h20M4 17l3-5h10l3 5M9 12l1-3h4l1 3"/>',
  sicherung: '<path d="M3 8h18v5H3zM7 8l-3 5M13 8l-3 5M19 8l-3 5M6 13v7M18 13v7"/>',
  mangel: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.6"/>',
  sonstiges: '<circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/>'
};
const CATS = [['uebersicht', 'Übersicht'], ['detail', 'Detail'], ['graben', 'Graben'], ['leitung', 'Leitung'], ['oberflaeche', 'Oberfläche'], ['sicherung', 'Absicherung'], ['mangel', 'Mangel'], ['sonstiges', 'Sonstiges']];
const catName = k => (CATS.find(c => c[0] === k) || CATS[7])[1];
const icon = (k, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">${ICON[k] || ICON.sonstiges}</svg>`;

/* Vorlagen: [Phase, Pflichtfoto, Hinweis, Kategorie, Pflicht?] */
const TPL = {
  glasfaser: { n: 'Glasfaser-Hausanschluss', r: 40, items: [
    ['V', 'Hausfassade mit Hausnummer', 'Ganzes Haus aufs Bild, die Hausnummer muss lesbar sein.', 'uebersicht'],
    ['V', 'Einführungsstelle vorher', 'Die Wandstelle, wo das Rohr reinkommt. 1–2 m Abstand.', 'detail'],
    ['W', 'Kopfloch mit Meterstab', 'Meterstab senkrecht an die Grubenwand. Die Tiefe muss ablesbar sein.', 'graben'],
    ['W', 'Speedpipe verlegt + Warnband', 'Rohr im Graben sichtbar, Warnband darüber – vor dem Verfüllen.', 'leitung'],
    ['W', 'Hauseinführung abgedichtet', 'Nah ran: Dichtung und Rohr scharf im Bild.', 'detail'],
    ['N', 'HÜP / Gf-AP montiert', 'Gerät komplett, Aufkleber oder Seriennummer lesbar.', 'detail'],
    ['N', 'Oberfläche wiederhergestellt', 'Gleicher Standort und Blickwinkel wie beim Vorher-Foto.', 'oberflaeche']] },
  tiefbau: { n: 'Tief- & Leitungsbau', r: 150, items: [
    ['V', 'Gesamtansicht Straße', 'Von der Straße aus – die ganze Baustelle im Bild.', 'uebersicht'],
    ['V', 'Belag / Oberfläche vorher', 'Zustand vor dem Aufbruch. Vorhandene Schäden mit drauf.', 'oberflaeche'],
    ['V', 'Absperrung & Beschilderung', 'Die komplette Verkehrssicherung in einem Bild.', 'sicherung'],
    ['W', 'Graben offen mit Meterstab', 'Meterstab senkrecht an die Grabenwand. Tiefe ablesbar.', 'graben'],
    ['W', 'Leitung verlegt, vor Verfüllung', 'Rohr, Bettung und Warnband müssen sichtbar sein.', 'leitung'],
    ['W', 'Kreuzung Fremdleitung', 'Nur wenn vorhanden: Abstand mit Meterstab zeigen.', 'leitung', false],
    ['N', 'Verfüllung / Verdichtung', 'Lagenweise verdichtet, gern mit Rüttelplatte im Bild.', 'graben'],
    ['N', 'Oberfläche wiederhergestellt', 'Vom gleichen Standort wie das erste Foto.', 'oberflaeche']] },
  hochbau: { n: 'Hochbau / Ausbau', r: 60, items: [
    ['V', 'Bestand Raum / Bauteil', 'Ecke zu Ecke, damit man den Raum wiedererkennt.', 'uebersicht'],
    ['W', 'Installation offen', 'Vor dem Verschließen! Leitungen und Dosen gut sichtbar.', 'leitung'],
    ['W', 'Dämmung / Abdichtung', 'Stöße und Anschlüsse nah fotografieren.', 'detail'],
    ['N', 'Fertigzustand', 'Gleicher Standort wie beim Bestand-Foto.', 'uebersicht'],
    ['N', 'Restarbeiten / Mängel', 'Nur wenn etwas offen ist.', 'mangel', false]] },
  schaden: { n: 'Schaden / Mangel', r: 40, items: [
    ['V', 'Übersicht Schadstelle', 'So weit weg, dass man den Ort eindeutig erkennt.', 'uebersicht'],
    ['V', 'Detail mit Maßstab', 'Zollstock oder Meterstab direkt daneben legen.', 'mangel'],
    ['W', 'Ursache / Umfeld', 'Was hat den Schaden verursacht?', 'mangel', false],
    ['N', 'Nach Behebung', 'Gleicher Blickwinkel wie die Übersicht.', 'uebersicht']] },
  frei: { n: 'Allgemein', r: 80, items: [
    ['V', 'Übersicht vorher', 'Gesamtansicht, bevor es losgeht.', 'uebersicht'],
    ['W', 'Arbeit läuft', 'Der wichtigste Zwischenstand.', 'sonstiges'],
    ['N', 'Ergebnis', 'Gleicher Standort wie das Vorher-Foto.', 'uebersicht']] }
};
const mkItems = tpl => TPL[tpl].items.map((a, i) => ({ id: 'i' + i, phase: a[0], label: a[1], hint: a[2], cat: a[3], must: a[4] !== false }));

/* ---------------- Speicher (IndexedDB, Fallback im Arbeitsspeicher) ---------------- */
const DB = {
  db: null, mem: { sites: new Map(), photos: new Map(), kv: new Map() },
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('sefki-baudoku', 1);
        r.onupgradeneeded = () => { const d = r.result; ['sites', 'photos', 'kv'].forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        setTimeout(() => rej(new Error('timeout')), 5000);

}

let speaking = false;

  const pts = [];

    const v = -1 + 2 * i / 29; const ry = Math.sqrt(Math.max(0, 1 - v * v));
    const shape = ry * (v > 0.1 ? 1 - 0.32 * (v - 0.1) : 1); const n = Math.max(6, Math.round(46 * shape));
    for (let k = 0; k < n; k++) { const u = k / n * Math.PI * 2; pts.push([Math.cos(u) * shape * 0.74, v, Math.sin(u) * shape * 0.84]); }
  }

    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, W);

      const X = ex * ca + 0.76 * sa, Z = -ex * sa + 0.76 * ca;
      if (Z > 0.25) { g.shadowColor = '#3fd8ef'; g.shadowBlur = 8; g.fillStyle = 'rgba(215,250,255,.95)'; g.beginPath(); g.ellipse(cx + X * sc, cy - 0.14 * sc, 3.4 * Z, 1.5, 0, 0, 7); g.fill(); g.shadowBlur = 0; }
    }
    const mo = speaking ? 0.6 + Math.abs(Math.sin(t * 17)) * 3.2 : 0.7;

}

const activeSites = () => S.sites.filter(s => !s.archived);

  if (pin) { const d = dist(pos, pin); if (d <= pin.radius + 300) return { state: 'in', site: pin, d, pinned: true }; }
  let best = null;

  const { s, d } = best; const acc = Math.min(pos.acc || 0, 60);

    if (g[2] && g[4]) {
      res.lat = dms(g[2]) * (String.fromCharCode(v.getUint8(g[1].vo)) === 'S' ? -1 : 1);
      res.lon = dms(g[4]) * (String.fromCharCode(v.getUint8(g[3].vo)) === 'W' ? -1 : 1);

}

async function exportPDF(btn) {

function geoFeatures(l) {
  return { type: 'FeatureCollection', features: l.filter(p => p.lat != null).map(p => { const s = S.sites.find(x => x.id === p.siteId), it = s?.items.find(i => i.id === p.itemId);
    return { type: 'Feature', geometry: { type: 'Point', coordinates: [+p.lon.toFixed(7), +p.lat.toFixed(7)] }, properties: { datei: fileName(p), zeit: new Date(p.ts).toISOString(), baustelle: s?.name || null, pflichtfoto: it?.label || null, phase: PH[p.phase].n, kategorie: catName(p.cat), genauigkeit_m: p.acc, blickrichtung_grad: p.heading, adresse: p.address || null, stichworte: p.labels, beschreibung: p.desc || null } }; }) };
}
function fileName(p) { const s = S.sites.find(x => x.id === p.siteId), it = s?.items.find(i => i.id === p.itemId); return `${stamp(p.ts)}_${p.phase}_${slug(it ? it.label : catName(p.cat))}_${p.id.slice(-4)}.jpg`; }
function kml(l) {
  const x = s => esc(s);
  return `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>SEF-KI Fotos</name>\n` +
    S.sites.filter(s => l.some(p => p.siteId === s.id)).map(s => `<Placemark><name>${x(s.name)}</name><description>Umkreis ${s.radius} m</description><Point><coordinates>${s.lon},${s.lat},0</coordinates></Point></Placemark>`).join('\n') + '\n' +
    l.filter(p => p.lat != null).map(p => `<Placemark><name>${x(fileName(p))}</name><TimeStamp><when>${new Date(p.ts).toISOString()}</when></TimeStamp><description>${x(PH[p.phase].n + ' · ' + catName(p.cat) + (p.heading != null ? ' · Blick ' + p.heading + '°' : '') + (p.desc ? ' · ' + p.desc : ''))}</description><Point><coordinates>${p.lon},${p.lat},0</coordinates></Point></Placemark>`).join('\n') + '\n</Document></kml>';
}
function csv(l) {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const head = ['Datei', 'Datum', 'Uhrzeit', 'Baustelle', 'Auftrag', 'Pflichtfoto', 'Phase', 'Kategorie', 'Breite', 'Länge', 'Genauigkeit_m', 'Blick_Grad', 'Adresse', 'Stichworte', 'Beschreibung'];
  return '﻿' + head.join(';') + '\n' + l.map(p => { const s = S.sites.find(x => x.id === p.siteId), it = s?.items.find(i => i.id === p.itemId);
    return [fileName(p), fmtDate(p.ts), fmtTime(p.ts), s?.name, s?.order, it?.label, PH[p.phase].n, catName(p.cat), p.lat?.toFixed(7).replace('.', ','), p.lon?.toFixed(7).replace('.', ','), p.acc, p.heading, p.address, (p.labels || []).join(', '), p.desc].map(q).join(';'); }).join('\n');
}

async function backup(btn) {

    await needLib('ZIP-Baustein', () => window.JSZip);
    const zip = new window.JSZip();
    zip.file('daten.json', JSON.stringify({ app: 'sefki-baudoku', v: 1, at: Date.now(), settings: S.set, sites: S.sites, photos: S.photos.map(({ blob, ...r }) => r) }));
    const ph = zip.folder('fotos'); S.photos.forEach(p => ph.file(p.id + '.jpg', p.blob));
    const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });

  } catch (e) { toast('Backup fehlgeschlagen: ' + (e.message || e)); }

async function restore(file) {
  try {
    await needLib('ZIP-Baustein', () => window.JSZip);
    const zip = await window.JSZip.loadAsync(file); const j = JSON.parse(await zip.file('daten.json').async('string'));
    if (j.app !== 'sefki-baudoku') throw new Error('Das ist kein SEF-KI-Backup');
    let ns = 0, np = 0;
    for (const s of j.sites) if (!S.sites.find(x => x.id === s.id)) { await DB.put('sites', s); S.sites.push(s); ns++; }
    for (const r of j.photos) { if (S.photos.find(x => x.id === r.id)) continue; const f = zip.file('fotos/' + r.id + '.jpg'); if (!f) continue; const p = { ...r, blob: await f.async('blob') }; await DB.put('photos', p); S.photos.push(p); np++; }
    toast(`Wiederhergestellt: ${ns} Baustellen, ${np} Fotos.`); refresh(true);
  } catch (e) { toast('Wiederherstellen fehlgeschlagen: ' + (e.message || e), 5000); }
}

  $('#stSeries', el).onchange = e => { S.set.series = e.target.checked; saveSet(); };
  $('#stDemo', el).onchange = e => setDemo(e.target.checked);
  $('#stBackup', el).onclick = e => backup(e.target);
  $('#stRestore', el).onclick = () => $('#fileRestore').click();
  $('#stEx', el)?.addEventListener('click', e => { if (e.target.dataset.sure) { closeSheet(); removeExamples(); } else { e.target.dataset.sure = '1'; e.target.textContent = 'Sicher? Beispiele löschen'; } });
  $('#stInstall', el)?.addEventListener('click', async () => { installEvt.prompt(); installEvt = null; closeSheet(); });
  el.querySelector('[data-x=close]').onclick = closeSheet;
}

/* ---------------- Ereignisse ---------------- */
function bind() {
  $('#logo').innerHTML = logoSVG();
  $$('.tab').forEach(t => t.onclick = () => go(t.dataset.v));
  $('#fab').onclick = () => openCamera();
  $('#btnSettings').onclick = openSettings;
  $('#btnNewSite').onclick = newSite;
  $('#cards').onclick = e => { const b = e.target.closest('.card'); if (b) S.cards[+b.dataset.i]?.a(); };
  $('#nextBar').onclick = () => S.cards[0]?.a();
  $('#v-cockpit').addEventListener('click', e => {
    const row = e.target.closest('.crow'); if (row) { if (row.dataset.photo) openPhoto(row.dataset.photo); else openCamera(row.dataset.site, row.dataset.item); return; }
    const os = e.target.closest('[data-open-site]'); if (os) { openSite(os.dataset.openSite); return; }
    const dm = e.target.closest('[data-demo]'); if (dm) { S.set.demoAt = dm.dataset.demo; S.set.pin = null; saveSet(); startDemo(); renderDemoBox(); }
  });
  $('#camClose').onclick = closeCamera;
  $('#shutter').onclick = shoot;
  $('#btnCamApp').onclick = () => $('#fileCap').click();
  $('#btnDemoShot').onclick = () => { const { item } = camTarget(); handleCapture(demoCanvas(item ? item.label : 'Freies Foto', item?.phase || 'W', Math.random() * 1000 | 0), snapMeta()); };
  $('#camImport').onclick = () => $('#fileImp').click();
  $('#camSeries').onclick = () => { S.set.series = !S.set.series; saveSet(); $('#camSeries').classList.toggle('on', S.set.series); renderCamHud(); toast(S.set.series ? 'Serienmodus an: Ich speichere sofort, wenn alles passt.' : 'Serienmodus aus: Du prüfst jedes Foto.'); };
  $('#fileCap').onchange = e => { const f = [...e.target.files]; e.target.value = ''; if (f.length) importFiles(f, true); };
  $('#fileImp').onchange = e => { const f = [...e.target.files]; e.target.value = ''; if (f.length) importFiles(f, false); };
  $('#fileRestore').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) { closeSheet(); restore(f); } };
  $('#btnImport').onclick = () => $('#fileImp').click();
  $('#galSeg').onclick = e => { const b = e.target.closest('[data-g]'); if (b) { S.gal.mode = b.dataset.g; renderGallery(); } };
  $('#galSites').onclick = e => { const b = e.target.closest('[data-gs]'); if (b) { S.gal.site = b.dataset.gs; renderGallery(); } };
  $('#galList').onclick = e => { const b = e.target.closest('[data-photo]'); if (b) openPhoto(b.dataset.photo); };
  $('#repRange').onclick = e => { const b = e.target.closest('[data-rr]'); if (b) { S.rep.range = b.dataset.rr; renderReport(); } };
  $('#repSites').onclick = e => { const b = e.target.closest('[data-rs]'); if (b) { S.rep.site = b.dataset.rs; renderReport(); } };
  $('#repSum').onclick = e => { const b = e.target.closest('[data-ex]'); if (!b) return; b.dataset.ex === 'pdf' ? exportPDF(b) : exportZIP(b); };
  addEventListener('keydown', e => {
    if (e.target.matches('input,textarea,select') || $('#scrim') || !$('#cam').hidden) { if (e.key === 'Escape') { closeSheet(); if (!$('#cam').hidden && $('#review').hidden) closeCamera(); } return; }
    if (/^[1-3]$/.test(e.key)) S.cards[+e.key - 1]?.a();
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !$('#cam').hidden && !wakeLock) navigator.wakeLock?.request('screen').then(w => wakeLock = w).catch(() => {}); });
  mapInput();
}

/* ---------------- Start ---------------- */
(async function init() {
  bind(); startAvatar();
  const ok = await DB.open();
  try {
    const kv = await DB.all('kv'); const st = kv.find(x => x.id === 'settings'); if (st) Object.assign(S.set, st);
    S.sites = await DB.all('sites'); S.photos = await DB.all('photos');
  } catch (e) {}
  if (!ok) toast('Gerätespeicher nicht verfügbar – Fotos bitte sofort exportieren.', 6000);
  if (!S.set.seeded) {
    try { await Promise.race([document.fonts?.ready, new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
    try { await seedExamples(); } catch (e) { console.warn(e); }
  }
  try { S.persisted = await navigator.storage?.persisted?.(); if (!S.persisted && navigator.storage?.persist) S.persisted = await navigator.storage.persist(); } catch (e) {}
  initHeading();
  const h = location.hash.slice(1); go(['cockpit', 'karte', 'galerie', 'bericht'].includes(h) ? h : 'cockpit');
  startGPS();
  if (S.set.demo) toast('Demo-Position aktiv – in den Einstellungen abschaltbar.', 3000);
  if ('serviceWorker' in navigator && !inFrame && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body></html>
